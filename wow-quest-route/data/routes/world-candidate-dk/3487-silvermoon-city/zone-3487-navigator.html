function renderSegments(){const root=document.getElementById('segments');root.innerHTML='';segments.forEach(s=>{const b=document.createElement('button');b.className='segment'+(s.id===activeSegment?' active':'');b.innerHTML=`<strong>${s.id} · ${s.title}</strong><small>${s.goal}</small>`;b.onclick=()=>{activeSegment=s.id;selectedStep=s.steps[0];selectedTarget=0;renderAll()};root.append(b)})}
function renderSteps(){const root=document.getElementById('steps');root.innerHTML='';visibleSteps().forEach(s=>{const d=document.createElement('div');d.className='step'+(s.step===selectedStep?' active':'');d.innerHTML=`<div class="step-head"><span class="num">${s.step}</span><strong>${s.action}</strong></div><div class="step-q">${s.quests.map(q=>q.quest_id+' '+q.name).join('、')}</div>`;d.onclick=()=>{selectedStep=s.step;selectedTarget=0;renderAll()};root.append(d)})}
function renderNavigator(){const rows=targetRows(),s=step(),cur=currentXY();if(selectedTarget>=rows.length)selectedTarget=0;const t=rows[selectedTarget];document.getElementById('instruction').textContent=s.instruction;const list=document.getElementById('targets');list.innerHTML='';rows.forEach((r,i)=>{const card=document.createElement('div');card.className='target'+(i===selectedTarget?' active':'');const p=r.point;let dir='无可用坐标';if(p&&cur)dir=compass(p.x-cur.x,p.y-cur.y);else if(p)dir='输入当前位置后计算';card.innerHTML=`<h3>${i+1}. ${r.name}</h3><small>${r.kind==='npc'?'NPC':'物体/目标'} · 数据库共 ${r.coordinates.length} 个点</small><div class="dir">${dir}</div><small>${p?`建议点 ${p.x.toFixed(1)}, ${p.y.toFixed(1)}`:'无坐标'}</small>`;card.onclick=()=>{selectedTarget=i;renderNavigator()};list.append(card)});if(!t){document.getElementById('targetName').textContent='本步骤没有可定位目标';document.getElementById('direction').textContent='—';document.getElementById('targetCoord').textContent='目标坐标：—';document.getElementById('delta').textContent='';return}const p=t.point;document.getElementById('targetName').textContent=t.name;if(!p){document.getElementById('direction').textContent='无坐标';document.getElementById('targetCoord').textContent='目标坐标：—';document.getElementById('delta').textContent='Questie未提供该目标在本区域的坐标';return}document.getElementById('targetCoord').textContent=`目标坐标：${p.x.toFixed(1)}, ${p.y.toFixed(1)}`;if(!cur){document.getElementById('direction').textContent='输入坐标';document.getElementById('delta').textContent='在游戏地图上查看当前X、Y后输入';return}const dx=p.x-cur.x,dy=p.y-cur.y;document.getElementById('direction').textContent=compass(dx,dy);document.getElementById('delta').textContent=`X ${dx>=0?'+':''}${dx.toFixed(1)}（${dx>=0?'向东':'向西'}），Y ${dy>=0?'+':''}${dy.toFixed(1)}（${dy>=0?'向南':'向北'}），地图坐标距离 ${Math.hypot(dx,dy).toFixed(1)}`;
const warn=document.getElementById('warning');warn.innerHTML=rows.some(r=>r.coordinates.length>12)?'<div class="warning">这个任务目标分布点较多。页面不会画大圈，而是只选离你当前位置最近的一个具体Questie点；打怪过程中可重新输入坐标，再计算下一个最近点。</div>':''}
function obs(qid){return route.fivebox_observations[String(qid)]}
function renderDetail(){const s=step(),root=document.getElementById('detail');root.innerHTML=`<div class="quest"><span class="badge">步骤 ${s.step}</span><span class="badge">${s.action}</span><h2>${s.quests.map(q=>q.name).join(' / ')}</h2><div class="note">这里只按主控号规划路线；另外四个号只在必须分别操作时提醒。</div></div>`+s.quests.map(q=>{const o=obs(q.quest_id),cls=o?.status==='user_confirmed'?'ok':o?'warn':'';return `<div class="quest"><span class="qid">${q.quest_id}</span> <strong>${q.name}</strong><div class="note">任务等级 ${q.quest_level} · 最低等级 ${q.required_level}</div>${o?`<p><span class="badge ${cls}">${o.status==='user_confirmed'?'实测确认':'待确认'}</span>${o.note||''}</p>`:''}</div>`}).join('');renderChain()}
function renderChain(){const root=document.getElementById('chain'),s=step();root.innerHTML='<h3>当前任务链</h3>';s.quests.forEach((q,qi)=>{if(qi)root.insertAdjacentHTML('beforeend','<hr style="border:0;border-top:1px solid #2d3a49;margin:15px 0">');const pres=[...q.pre_single,...q.pre_group].map(id=>byQuest.get(id)).filter(Boolean);const children=route.quest_catalog.filter(x=>[...x.pre_single,...x.pre_group].includes(q.quest_id));const items=[];pres.forEach(x=>items.push({label:'前置',q:x}));items.push({label:'当前',q,current:true});children.forEach(x=>items.push({label:'后续',q:x}));if(!pres.length&&!children.length)items.push({label:'说明',text:'本页数据中没有可见的前置或后续任务'});items.forEach((it,i)=>{if(i&&it.q)root.insertAdjacentHTML('beforeend','<div class="chain-arrow">↓</div>');if(it.q)root.insertAdjacentHTML('beforeend',`<div class="chain-item ${it.current?'current':''}"><div class="chain-label">${it.label}</div><div><div class="chain-name"><span class="qid">${it.q.quest_id}</span> ${it.q.name}</div><div class="note">最低等级 ${it.q.required_level}</div></div></div>`);else root.insertAdjacentHTML('beforeend',`<div class="note">${it.text}</div>`)})})}
function renderAll(){renderSegments();renderSteps();renderNavigator();renderDetail()}
document.getElementById('locate').onclick=renderNavigator;document.getElementById('curX').oninput=renderNavigator;document.getElementById('curY').oninput=renderNavigator;renderAll();
</script>
</body></html>
