function stop(){playing=false;playMode='';document.getElementById('playSegment').textContent='▶ 当前段';document.getElementById('playRemaining').textContent='▶ 剩余路线';cancelAnimationFrame(raf);last=0}function startSegment(){if(cur<=0)return;stop();prog=0;move(S[cur-1].x,S[cur-1].y);fit(cur);render();playing=true;playMode='segment';document.getElementById('playSegment').textContent='⏸ 当前段';raf=requestAnimationFrame(tick)}function startRemaining(){if(cur>=S.length-1)return;stop();cur++;prog=0;move(S[cur-1].x,S[cur-1].y);fit(cur);render();playing=true;playMode='remaining';document.getElementById('playRemaining').textContent='⏸ 剩余路线';raf=requestAnimationFrame(tick)}function tick(t){if(!playing)return;if(!last)last=t;let dt=(t-last)*+document.getElementById('speed').value;last=t;let kind=cur>0?(S[cur].transport||'ride'):'ride',jump=kind==='hearth'||kind==='script'||kind==='crossmap',dur=jump?850:1400;prog=Math.min(1,prog+dt/dur);let a=S[cur-1],b=S[cur],u=jump?(prog<.58?0:1):prog;move(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u);pu.setAttribute('r',1+.5*Math.abs(Math.sin(t/220)));if(prog>=1){move(b.x,b.y);if(playMode==='segment'){stop();return}if(cur<S.length-1){cur++;prog=0;fit(cur);render()}else{render();stop();return}}raf=requestAnimationFrame(tick)}function jump(i){stop();cur=Math.max(0,Math.min(S.length-1,i));prog=0;move(S[i].x,S[i].y);fit(cur);render()}
const zoneSelect=document.getElementById('zone');Object.entries(ROUTES).sort((a,b)=>(a[1].order??999)-(b[1].order??999)).forEach(([key,r])=>{let o=document.createElement('option');o.value=key;o.textContent=r.displayName||r.title;zoneSelect.appendChild(o)});zoneSelect.value=routeKey;
document.getElementById('zone').onchange=e=>{routeKey=e.target.value;rebuild()};document.getElementById('playSegment').onclick=()=>playing&&playMode==='segment'?stop():startSegment();document.getElementById('playRemaining').onclick=()=>playing&&playMode==='remaining'?stop():startRemaining();document.getElementById('next').onclick=()=>{stop();cur=Math.min(S.length-1,cur+1);prog=0;if(cur>0){move(S[cur-1].x,S[cur-1].y);fit(cur);render();startSegment()}else render()};document.getElementById('prev').onclick=()=>{stop();cur=Math.max(0,cur-1);prog=0;if(cur>0){move(S[cur-1].x,S[cur-1].y);fit(cur);render();startSegment()}else{move(S[0].x,S[0].y);render()}};document.getElementById('reset').onclick=()=>{stop();cur=0;prog=0;move(S[0].x,S[0].y);full();render()};document.getElementById('full').onclick=()=>{document.getElementById('follow').checked=false;full()};document.getElementById('toggleMapLabels').onclick=()=>{let layer=document.getElementById('mapLabels'),hidden=layer.classList.toggle('hidden');document.getElementById('toggleMapLabels').textContent=hidden?'中文地名：关':'中文地名：开'};document.getElementById('mode').onchange=render;document.getElementById('follow').onchange=()=>document.getElementById('follow').checked?fit(cur):full();document.getElementById('hudToggle').onclick=()=>{let h=document.getElementById('hud'),c=h.classList.toggle('collapsed');document.getElementById('hudToggle').textContent=c?'展开 ▼':'收起 ▲'};rebuild();
</script></body></html>
