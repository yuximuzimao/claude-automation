-location\">赤色大教堂</span><span class=\"ra-arrow\">→</span><span class=\"ra-branch\">↳</span> <span class=\"ra-verb\">做</span> <span class=\"ra-task ra-do-task\">第二次机会</span></div>\n<div class=\"ra-line\"><span class=\"ra-location\">赤色大教堂·高级指挥官埃雷特</span><span class=\"ra-arrow\">→</span><span class=\"ra-verb\">交</span> <span class=\"ra-task ra-turnin\">第二次机会</span>→ <span class=\"ra-verb\">接</span> <span class=\"ra-task ra-accept\">元帅的下落</span></div>\n<div class=\"ra-line\">先锋军港口南侧洞穴 → <span class=\"ra-branch\">↳</span> <span class=\"ra-verb\">做</span> <span class=\"ra-task ra-do-task\">元帅的下落</span></div>\n<div class=\"ra-line\"><span class=\"ra-location\">死亡高地</span><span class=\"ra-arrow\">→</span><span class=\"ra-verb\">交</span> <span class=\"ra-task ra-turnin\">元帅的下落</span>、<span class=\"ra-task ra-turnin\">禁飞区</span></div>","noteHtml":"<div class=\"ra-note-heading\">备注</div><div class=\"ra-note-block\"><div class=\"ra-note-task\">《禁飞区》</div><div class=\"ra-note-text\"><span class=\"ra-shared\">共享：</span>不强制使用骨狮鹫，五号直接组队击杀先锋军狮鹫骑士也可。</div></div><div class=\"ra-note-block\"><div class=\"ra-note-task\">《第二次机会》</div><div class=\"ra-note-text\"><span class=\"ra-shared\">共享：</span>一具兰德雷尸体只能成功打开一个门；开门后留在教堂等审讯脚本结束，并向出现的埃雷特交任务/接后续。教堂小怪重生较快，Boss尽量拉到后侧处理。</div></div><div class=\"ra-note-block\"><div class=\"ra-note-task\">《元帅的下落》</div><div class=\"ra-note-text\"><span class=\"ra-shared\">共享：</span>洞穴在岛屿南侧约8.9,46.2；《第二次机会》审讯结束后直接在岛上完成。首组靠路人协助通过，按当前五圣骑战力属于后续高概率跳过候选；暂不从正式路线删除，等完整实测收益复盘后再决定。</div></div>","timing":{"centerMinutes":16.0,"rangeMinutes":[10.0,28.0],"includeInTotal":true,"status":"pre_live_marginal_budget"},"questIds":[12852]},{"start":84,"end":94,"title":"黑色观察站 → 缝合场","summary":"","actionHtml":"<div class=\"ra-line\"><span class=\"ra-location\">黑色观察站·黑暗骑士阿尔蕾</span><span class=\"ra-arrow\">→</span><span class=\"ra-verb\">交</span> <span class=\"ra-task ra-turnin\">黑色观察站</span>→ <span class=\"ra-verb\">接</span> <span class=\"ra-task ra-accept\">它们从哪儿来的？</span></div>\n<di function raFindNoteBox(actionEl,create){
  const fallback=document.querySelector('[data-ra-semantic-fallback="1"]');
  if(fallback)return fallback;
  let root=actionEl.parentElement;
  for(let depth=0;root&&depth<4;depth++,root=root.parentElement){
    const nodes=[...root.querySelectorAll('div,p,section')];
    const hit=nodes.find(node=>{
      if(node===actionEl||node.contains(actionEl))return false;
      const text=(node.textContent||'').trim();
      return text.startsWith('备注：')||text.startsWith('备注:');
    });
    if(hit)return hit;
  }
  if(!create)return null;
  const box=document.createElement('div');
  box.dataset.raSemanticFallback='1';
  actionEl.insertAdjacentElement('afterend',box);
  return box;
}

(function installRouteAtlasResume(){
  const STEP_PREFIX='route-atlas:last-step:';
  const LAST_ROUTE='route-atlas:last-route';
  const originalInfo=info;
  let restoring=true;
  function currentRouteKey(){
    try{
      const current=route();
      const hit=Object.entries(ROUTES).find(([,value])=>value===current);
      if(hit)return hit[0];
      return current?.displayName||current?.title||'default';
    }catch(_){
      return 'default';
    }
  }
  function savedStep(routeKey){
    try{
      const saved=Number.parseInt(localStorage.getItem(STEP_PREFIX+routeKey)||'',10);
      return Number.isInteger(saved)?saved:null;
    }catch(_){
      return null;
    }
  }
  function restoreStep(){
    const saved=savedStep(currentRouteKey());
    if(saved!==null&&Array.isArray(G)&&G.length){
      cur=Math.max(0,Math.min(saved,G.length-1));
    }
  }
  function saveState(){
    try{
      const key=currentRouteKey();
      localStorage.setItem(LAST_ROUTE,key);
      localStorage.setItem(STEP_PREFIX+key,String(cur));
    }catch(_){}
  }
  function activateRoute(routeKey){
    if(!routeKey||!ROUTES[routeKey]||routeKey===currentRouteKey())return;
    const label=ROUTES[routeKey].displayName||ROUTES[routeKey].title||'';
    const nodes=[...document.querySelectorAll('button,[role="tab"],option')];
    const hit=nodes.find(node=>
      node.dataset?.route===routeKey||
      node.dataset?.key===routeKey||
      node.dataset?.routeKey===routeKey||
      node.value===routeKey||
      (label&&(node.textContent||'').trim()===label)
    );
    if(!hit)return;
    if(hit.tagName==='OPTION'&&hit.parentElement){
      hit.parentElement.value=hit.value;
      hit.parentElement.dispatchEvent(new Event('change',{bubbles:true}));
    }else{
      hit.click();
    }
  }
  info=function(){
    originalInfo();
    if(!restoring)saveState();
  };
  function resume(){
    let lastRoute='';
    try{lastRoute=localStorage.getItem(LAST_ROUTE)||'';}catch(_){}
    activateRoute(lastRoute);
    restoreStep();
    originalInfo();
    restoring=false;
    saveState();
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>setTimeout(resume,0),{once:true});
  }else{
    setTimeout(resume,0);
  }
})();
/* ROUTE_RESUME_END */
