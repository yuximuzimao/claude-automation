function move(x,y){mv.setAttribute('cx',x);mv.setAttribute('cy',y);pu.setAttribute('cx',x);pu.setAttribute('cy',y)}function full(){svg.setAttribute('viewBox','0 0 100 100');syncLabels()}function fit(i){if(!document.getElementById('follow').checked)return;let gr=G[i],from=Math.max(0,gr.start-1),pts=S.slice(from,gr.end+1),miX=Math.min(...pts.map(p=>p.x)),maX=Math.max(...pts.map(p=>p.x)),miY=Math.min(...pts.map(p=>p.y)),maY=Math.max(...pts.map(p=>p.y)),z=Math.min(100,Math.max(maX-miX,maY-miY,16)+9),cx=(miX+maX)/2,cy=(miY+maY)/2,x=Math.max(0,Math.min(100-z,cx-z/2)),y=Math.max(0,Math.min(100-z,cy-z/2));svg.setAttribute('viewBox',`${x} ${y} ${z} ${z}`);syncLabels()}

function tick(t){if(!playing)return;if(!last)last=t;let dt=(t-last)*+document.getElementById('speed').value;last=t;let a=S[animSeg],b=S[animSeg+1],kind=b?.transport||'ride',jump=kind==='hearth'||kind==='script'||kind==='crossmap',dur=jump?850:1400;prog=Math.min(1,prog+dt/dur);let u=jump?(prog<.58?0:1):prog;move(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u);pu.setAttribute('r',1+.5*Math.abs(Math.sin(t/220)));if(prog>=1){move(b.x,b.y);if(animSeg<animEnd){animSeg++;prog=0}else if(playMode==='segment'){stop();return}else if(cur<G.length-1){cur++;if(!prepareAnim(cur)){render();stop();return}}else{render();stop();return}}raf=requestAnimationFrame(tick)}
