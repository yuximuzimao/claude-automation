'mapLabels').appendChild(d)});full();move(S[0].x,S[0].y);render()}
function syncLabels(){let vb=svg.getAttribute('viewBox').trim().split(/\s+/).map(Number),[vx,vy,vw,vh]=vb;document.querySelectorAll('.mapLabel').forEach(el=>{let x=+el.dataset.x,y=+el.dataset.y,inside=x>=vx&&x<=vx+vw&&y>=vy&&y<=vy+vh;el.hidden=!inside;if(!inside)return;el.style.left=`${(x-vx)/vw*100}%`;el.style.top=`${(y-vy)/vh*100}%`})}
function render(){let m=document.getElementById('mode').value,rg=groupSegRange(G[cur]);seg.forEach((l,i)=>{let active=rg&&i>=rg.start&&i<=rg.end,past=rg?i<rg.start:false;l.style.opacity=m==='full'?.38:m==='progress'?(past?.28:active?1:.055):(active?1:.035);let special=isTransport(i);l.style.strokeWidth=active?(special?'3.4':'3.0'):(special?'1.8':'1.25')});document.querySelectorAll('.step').forEach((n,i)=>{n.classList.toggle('past',i<cur);n.classList.toggle('active',i===cur)});info()}
function info(){let gr=G[cur],a=S[gr.end],p=S[Math.max(0,gr.start-1)],b=G[Math.min(cur+1,G.length-1)];document.getElementById('stat').textContent=`${route().displayName||document.getElementById('zone').selectedOptions[0].text} · 步骤 ${cur+1}/${G.length}`;document.getElementById('hudTitle').textContent=gr.title;document.getElementById('hudCoord').textContent=gr.start===0?`本段 ${S[gr.start].label} → ${a.label} (${a.x.toFixed(2)},${a.y.toFixed(2)})`:`${p.label} (${p.x.toFixed(2)},${p.y.toFixed(2)}) → ${a.label} (${a.x.toFixed(2)},${a.y.toFixed(2)})`;document.getElementById('hudAction').textContent=gr.summary;document.getElementById('hudNext').textContent=cur<G.length-1?`下一步：${b.title}`:'本图当前路线结束';let notes=groupNotes(gr),hn=document.getElementById('hudNote');hn.textContent=notes?`备注：${notes}`:'';hn.style.display=notes?'block':'none'}
function move(x,y){mv.setAttribute('cx',x);mv.setAttribute('cy',y);pu.setAttribute('cx',x);pu.setAttribute('cy',y)}function full(){svg.setAttribute('viewBox','0 0 100 100');syncLabels()}function fit(i){if(!document.getElementById('follow').checked)return;let gr=G[i],from=Math.max(0,gr.start-1),pts=S.slice(from,gr.end+1),miX=Math.min(...pts.map(p=>p.x)),maX=Math.max(...pts.map(p=>p.x)),miY=Math.min(...pts.map(p=>p.y)),maY=Math.max(...pts.map(p=>p.y)),z=Math.min(100,Math.max(maX-miX,maY-miY,16)+9),cx=(miX+maX)/2,cy=(miY+maY)/2,x=Math.max(0,Math.min(100-z,cx-z/2)),y=Math.max(0,Math.min(100-z,cy-z/2));svg.setAttribute('viewBox',`${x} ${y} ${z} ${z}`);syncLabels()}
function stop(){playing=false;playMode='';document.getElementById('playSegment').textContent='▶ 当前段';document.getElementById('playRemaining').textContent='▶ 剩余路线';cancelAnimationFrame(raf);last=0}
function prepareAnim(i){let rg=groupSegRange(G[i]);if(!rg)return false;animSeg=rg.start;animEnd=rg.end;prog=0;move(S[animSeg].x,S[animSeg].y);fit(i);render();return true}
function startSegment(){stop();if(!prepareAnim(cur))return;playing=true;playMode='segment';document.getElementById('playSegment').textContent='⏸ 当前段';raf=requestAnimationFrame(tick)}
function startRemaining(){stop();if(!prepareAnim(cur)){if(cur>=G.length-1)return;cur++;if(!prepareAnim(cur))return}playing=true;playMode='remaining';document.getElementById('playRemaining').textContent='⏸ 剩余路线';raf=requestAnimationFrame(tick)}
function tick(t){if(!playing)return;if(!last)last=t;let dt=(t-last)*+document.getElementById('speed').value;last=t;let a=S[animSeg],b=S[animSeg+1],kind=b?.transport||'ride',jump=kind==='hearth'||kind==='script'||kind==='crossmap',dur=jump?850:1400;prog=Math.min(1,prog+dt/dur);let u=jump?(prog<.58?0:1):prog;move(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u);pu.setAttribute('r',1+.5*Math.abs(Math.sin(t/220)));if(prog>=1){move(b.x,b.y);if(animSeg<animEnd){animSeg++;prog=0}else if(playMode==='segment'){stop();return}else if(cur<G.length-1){cur++;if(!prepareAnim(cur)){render();stop();return}}else{render();stop();return}}raf=requestAnimationFrame(tick)}
function jump(i){stop();cur=Math.max(0,Math.min(G.length-1,i));prog=0;let q=S[G[cur].end];move(q.x,q.y);fit(cur);render()}
const zoneSelect=document.getElementById('zone');Object.entries(ROUTES).sort((a,b)=>(a[1].order??999)-(b[1].order??999)).forEach(([key,r])=>{let o=document.createElement('option');o.value=key;o.textContent=r.displayName||r.title;zoneSelect.appendChild(o)});zoneSelect.value=routeKey;
document.getElementById('zone').onchange=e=>{routeKey=e.target.value;rebuild()};document.getElementById('playSegment').onclick=()=>playing&&playMode==='segment'?stop():startSegment();document.getElementById('playRemaining').onclick=()=>playing&&playMode==='remaining'?stop():startRemaining();document.getElementById('next').onclick=()=>{stop();cur=Math.min(G.length-1,cur+1);render();startSegment()};document.getElementById('prev').onclick=()=>{stop();cur=Math.max(0,cur-1);render();startSegment()};document.getElementById('reset').onclick=()=>{stop();cur=0;prog=0;move(S[0].x,S[0].y);full();render()};document.getElementById('full').onclick=()=>{document.getElementById('follow').checked=false;full()};document.getElementById('toggleMapLabels').onclick=()=>{let layer=document.getElementById('mapLabels'),hidden=layer.classList.toggle('hidden');document.getElementById('toggleMapLabels').textContent=hidden?'中文地名：关':'中文地名：开'};document.getElementById('mode').onchange=render;document.getElementById('follow').onchange=()=>document.getElementById('follow').checked?fit(cur):full();document.getElementById('hudToggle').onclick=()=>{let h=document.getElementById('hud'),c=h.classList.toggle('collapsed');document.getElementById('hudToggle').textContent=c?'展开 ▼':'收起 ▲'};rebuild();
</script></body></html>
